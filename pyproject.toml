[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.66.0",
    "google-genai>=2.3.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]