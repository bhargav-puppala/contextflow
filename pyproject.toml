[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow"
version = "0.1.2"
description = "Token-efficient context handoff for cross-agent task continuity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.66.0",
    "google-genai>=2.3.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.9.0",
    "mcp>=2.0.0",
]

[project.scripts]
contextflow-mcp = "contextflow.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextflow = ["data/*.json"]
